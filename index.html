<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>小台 · 个人效率工作台</title>
<meta name="theme-color" content="#2563EB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="小台工作台" />
<meta name="description" content="工作复盘、轻记录、健身打卡、资讯速览，离线可用的本地化个人效率工作台。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />

<style>
/* ============ 设计 token ============ */
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111827;
  --muted: #6b7280;
  --subtle: #9ca3af;
  --primary: #2563EB;
  --primary-soft: #DBEAFE;
  --primary-deep: #1D4ED8;
  --success: #16a34a;
  --danger: #e5484d;
  --warn: #f59e0b;
  --accent: #facc15;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
  --shadow: 0 2px 12px rgba(15,23,42,.06);
  --radius: 12px;
  --radius-sm: 8px;
  --tab-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --header-h: 60px;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tab-h) + var(--safe-bottom) + 12px);
}
@media (min-width: 900px) { body { padding-bottom: 24px; } }

/* ============ 顶部 header ============ */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.92); backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
}
.app-title { display:flex; align-items:center; gap:10px; font-weight: 700; font-size: 17px; }
.app-title .logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--primary);
  display:grid; place-items: center;
  flex: 0 0 auto;
}
.app-title .logo svg { width: 16px; height: 16px; }
.app-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ============ 通用 button / input ============ */
.btn {
  appearance: none; border: 1px solid var(--border); background: #fff; color: var(--text);
  height: 36px; padding: 0 12px; border-radius: var(--radius-sm);
  font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, color .15s, transform .05s;
  white-space: nowrap;
}
.btn:hover { background: #f3f4f6; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-deep); }
.btn.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
.btn.danger:hover { background: #fef2f2; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: #f3f4f6; color: var(--text); }
.btn.sm { height: 30px; padding: 0 9px; font-size: 13px; }
.btn.lg { height: 44px; padding: 0 16px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

input[type="text"], input[type="number"], input[type="date"], input[type="tel"], textarea, select {
  width: 100%;
  font: inherit; color: var(--text);
  background: #fff; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 9px 11px;
  outline: none; transition: border-color .15s, box-shadow .15s;
  min-height: 44px; font-size: 16px; /* 16 防止 iOS 放大 */
}
input:focus, textarea:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
label { font-size: 13px; color: var(--muted); display:block; margin-bottom: 5px; }

/* ============ 布局 ============ */
.container {
  max-width: 1100px; margin: 0 auto;
  padding: 16px;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px;
}
.card + .card { margin-top: 12px; }
.card h2 { margin: 0 0 12px; font-size: 16px; display:flex; align-items:center; gap: 8px; }
.card h2 .hint { font-size: 12px; color: var(--subtle); font-weight: normal; margin-left: auto; }
.section-title { font-size: 13px; color: var(--muted); margin: 18px 0 8px; letter-spacing: .03em; }

/* 移动 Tab Bar / PC 顶部 Tab */
.tabs { display: none; }
@media (max-width: 899px) {
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(6, 1fr);
    height: calc(var(--tab-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
  }
  .tabbar button {
    appearance: none; background: transparent; border: 0; color: var(--muted);
    display:flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 11px; cursor: pointer; padding: 4px 0;
  }
  .tabbar button.active { color: var(--primary); }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button .badge {
    position: absolute; transform: translate(10px,-6px);
    background: var(--danger); color: #fff; border-radius: 999px;
    font-size: 10px; line-height: 1; padding: 2px 5px; min-width: 16px;
  }
  .tabbar button { position: relative; }
}
@media (min-width: 900px) {
  .tabs {
    display: flex; gap: 4px; padding: 0 16px; max-width: 1100px; margin: 0 auto;
    border-bottom: 1px solid var(--border); background: rgba(255,255,255,.7);
    overflow-x: auto;
  }
  .tabs button {
    appearance: none; background: transparent; border: 0;
    padding: 12px 14px; cursor: pointer; color: var(--muted); font-size: 14px;
    border-bottom: 2px solid transparent;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tabs button svg { width: 16px; height: 16px; }
}

.view { display: none; }
.view.active { display: block; }

/* 网格 */
.grid { display: grid; gap: 12px; }
@media (min-width: 700px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

/* 今天要处理 */
.today {
  background: linear-gradient(135deg, #fff 0%, #f8fafc 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.today h2 { margin: 0 0 8px; font-size: 15px; display:flex; align-items:center; gap: 8px; }
.today h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.today ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.today li { display:flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
.today li .label { flex: 1; min-width: 0; }
.today li .meta { color: var(--subtle); font-size: 12px; flex-shrink: 0; }
.today li.overdue { border-color: #fecaca; background: #fef2f2; }
.today li.overdue .label::before { content: '逾期 '; color: var(--danger); font-weight: 600; }
.today li .btn { flex-shrink: 0; }

/* 复盘台 */
.review-item {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; background: #fff; margin-bottom: 10px;
}
.review-item .head { display:flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.review-item .date { font-weight: 600; font-size: 15px; }
.review-item .day-tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-deep); }
.review-item .section { margin: 6px 0; }
.review-item .section .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; display:flex; align-items:center; gap: 4px; }
.review-item .section .lbl svg { width: 14px; height: 14px; }
.review-item .section .body { white-space: pre-wrap; word-break: break-word; padding-left: 18px; position: relative; }
.review-item .section .body::before { content:''; position: absolute; left: 4px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.review-item .section.problem .body::before { background: var(--danger); }
.review-item .section.risk .body::before { background: var(--warn); }
.review-item .section.achievement .body::before { background: var(--success); }
.review-item .tags { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.review-item .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #f3f4f6; color: var(--muted); cursor: pointer; }
.review-item .tag:hover { background: #e5e7eb; }
.review-item .actions { display:flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }

/* 轻记录 */
.note-item {
  display: flex; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.note-item:last-child { border-bottom: 0; }
.note-item .t { color: var(--subtle); font-size: 12px; flex-shrink: 0; min-width: 56px; padding-top: 2px; }
.note-item .c { flex: 1; word-break: break-word; }
.note-item .x { color: var(--subtle); cursor: pointer; padding: 4px; align-self: flex-start; }
.note-item .x:hover { color: var(--danger); }


/* 健身打卡 */
.fit-compose { padding: 14px; }
.fit-compose textarea { width: 100%; resize: vertical; }
.fit-photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.fit-photos:empty { margin-top: 0; }
.fit-thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.fit-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fit-thumb-x { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.fit-thumb-x:hover { background: rgba(0,0,0,.75); }
.fit-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.fit-item-head .date { font-weight: 600; font-size: 14px; }
.fit-note { font-size: 14px; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin-bottom: 8px; }
.fit-photo { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--border); }
.fit-photo:hover { opacity: .92; }

/* 训记多维评价 */
.xunji-eval { margin-top: 16px; }
.xunji-head { display: flex; align-items: center; gap: 8px; margin: 6px 2px 12px; flex-wrap: wrap; }
.xunji-title { font-weight: 700; font-size: 15px; }
.xunji-head .hint { font-size: 12px; }
.xunji-head .spacer { flex: 1; }
.xunji-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.xunji-plan { margin-top: 14px; background:#f9fafb; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
.xunji-plan-head { font-weight:800; font-size:15px; margin-bottom:8px; }
.xunji-plan-sec { margin-bottom:10px; }
.xunji-plan-sec-h { font-weight:800; font-size:14px; margin-bottom:4px; }
.xunji-plan-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px dashed #eee; }
.xunji-plan-row:last-child { border-bottom:0; }
.xunji-pa { flex:1; min-width:0; }
.xunji-pw { color:var(--muted); white-space:nowrap; }
.xunji-pw b { color:var(--text); }
.xunji-pr { color:var(--subtle); font-size:12px; white-space:nowrap; }
.xunji-new { background:#ecfdf5; color:#059669; font-size:11px; font-weight:700; padding:1px 6px; border-radius:8px; white-space:nowrap; }
.xunji-plan-tip { margin-top:6px; font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 10px; line-height:1.5; }
.xunji-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.xunji-card-img { padding: 8px 8px 0; background: #fafafa; }
.xunji-card-img svg { display: block; max-width: 300px; margin: 0 auto; }
.xunji-card-body { padding: 12px 14px 14px; }
.xunji-card-title { font-weight: 800; font-size: 16px; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.xunji-sub { font-weight: 500; font-size: 12px; color: var(--muted); }
.xunji-tag { font-size: 13px; line-height: 1.6; color: var(--text); margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #f8fafc; border-left: 3px solid var(--border); }
.xunji-tag b { margin-right: 4px; }
.xunji-tag.s { border-left-color: #10b981; background: #ecfdf5; }
.xunji-tag.w { border-left-color: #ef4444; background: #fef2f2; }
.xunji-tag.a { border-left-color: #3b82f6; background: #eff6ff; }
.xunji-loading { color: var(--subtle); font-size: 13px; padding: 24px 8px; text-align: center; line-height: 1.7; }

/* 资讯 */
.news-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
.news-item:last-child { border-bottom: 0; }
.news-item .head { display:flex; align-items:center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.news-item .cat { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-deep); }
.news-item .src { font-size: 12px; color: var(--subtle); }
.news-item .ts { font-size: 12px; color: var(--subtle); margin-left: auto; }
.news-item .ttl { font-weight: 600; margin: 4px 0; font-size: 14px; }
.news-item .sm { font-size: 13px; color: var(--muted); margin: 0; }

/* 通用辅助 */
.empty { text-align: center; color: var(--subtle); padding: 28px 16px; font-size: 14px; }
.row { display:flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.spacer { flex: 1; }
.hint { color: var(--subtle); font-size: 12px; }
.ds-table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 12.5px; }
.ds-table th, .ds-table td { border: 1px solid var(--border); padding: 7px 8px; text-align: left; vertical-align: top; }
.ds-table th { background: var(--bg); color: var(--muted); font-weight: 600; }
.ds-table td b { color: var(--text); }
.ab-box { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 12px 0; background: var(--bg); }
.ab-title { font-weight: 600; margin-bottom: 4px; }
.ab-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 8px; }
.ab-actions { display: flex; flex-wrap: wrap; gap: 6px; }
hr.sep { border: 0; border-top: 1px dashed var(--border); margin: 14px 0; }

/* 备份提示 */
.backup-banner {
  display:flex; align-items: center; gap: 8px;
  background: #fef3c7; color: #92400e; border: 1px solid #fde68a;
  border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px;
}
.backup-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

/* modal */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15,23,42,.45);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius);
  width: 100%; max-width: 560px; max-height: 90vh; overflow: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,.18);
  padding: 18px;
}
.modal h3 { margin: 0 0 12px; font-size: 16px; }
.modal .form-row { margin-bottom: 10px; }
.modal .actions { display:flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* 标签输入 */
.tag-input { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: #fff; min-height: 44px; align-items: center; }
.tag-input input { border: 0; padding: 4px 6px; flex: 1; min-width: 80px; min-height: 28px; background: transparent; font-size: 14px; }
.tag-input input:focus { box-shadow: none; }
.tag-input .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: var(--primary-soft); color: var(--primary-deep); border-radius: 999px; font-size: 13px; }
.tag-input .pill button { appearance: none; border: 0; background: transparent; color: var(--primary-deep); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }

/* ===== 轻记录（设计图：随手记一笔 + 完成记录） ===== */
:root {
  --warm: #d97706;          /* 暖橙（设计图主调之一） */
  --warm-soft: #fef3c7;     /* 浅米底 */
  --warm-deep: #b45309;
  --pending: #2563EB;       /* 待办蓝 */
  --pending-soft: #DBEAFE;
}
.note-compose { padding: 14px 16px; }
.note-compose-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.note-compose-head .title { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
.note-compose-head .title svg { color: var(--warm); }
.note-compose-head .sub { font-size: 12px; color: var(--muted); }
#note-text {
  width: 100%; min-height: 60px; resize: vertical; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 12px; background: #fffdf8;
  font: inherit; font-size: 16px; color: var(--text); outline: none;
  box-sizing: border-box;
}
#note-text:focus { border-color: var(--warm); background: #fff; }
.note-cat { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.note-cat button {
  appearance: none; border: 1px solid var(--border); background: #fff;
  color: var(--text); padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px;
  cursor: pointer; min-height: 36px;
}
.note-cat button.active { background: var(--warm); color: #fff; border-color: var(--warm); }
.note-cat button:hover:not(.active) { border-color: var(--warm); }
.note-act { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note-act .btn { width: 100%; min-height: 44px; font-size: 15px; }
.btn.warm { background: var(--warm); color: #fff; border-color: var(--warm); }
.btn.warm:hover { background: var(--warm-deep); border-color: var(--warm-deep); }

/* 统计卡 */
#note-stats-card { padding: 12px 14px 14px; }
.note-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.note-stat {
  padding: 14px 12px; border-radius: 14px; text-align: center;
  background: #f7f5f1;
}
.note-stat .num { display: block; font-size: 28px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.note-stat .lbl { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.note-stat.s-done-today { background: #DCFCE7; } .note-stat.s-done-today .num { color: #16a34a; }
.note-stat.s-done-week  { background: var(--warm-soft); } .note-stat.s-done-week  .num { color: var(--warm-deep); }
.note-stat.s-total      { background: #f5e8da; } .note-stat.s-total      .num { color: #92400e; }
.note-stat.s-pending    { background: var(--pending-soft); } .note-stat.s-pending    .num { color: var(--pending); }

/* 列表区头部 + 过滤 tab */
.note-tabs-card { padding: 0; }
.note-tabs-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px dashed var(--border);
}
.note-tabs-head .title { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--text); }
.note-tabs-head .title svg { color: var(--warm); }
.note-filter { display: inline-flex; gap: 6px; }
.note-filter button {
  appearance: none; border: 1px solid var(--border); background: #fff;
  color: var(--text); padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px;
  cursor: pointer; min-height: 32px;
}
.note-filter button.active { background: var(--warm); color: #fff; border-color: var(--warm); }

/* 日分组 */
.note-day { padding: 14px 16px 6px; }
.note-day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.note-day-head .h { font-size: 13px; color: var(--text); font-weight: 600; }
.note-day-head .meta { font-size: 12px; color: var(--muted); }
.note-day-head .meta b { color: var(--warm); }

<script>
/* =========================================================
 * 小台工作台 - 全部逻辑
 * 单文件、零外部依赖、localStorage 持久化、JSON 导入导出
 * ========================================================= */
'use strict';

// ---------- 工具 ----------
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (s) => { try { const d = new Date(s); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } catch { return s; } };
const monthStr = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const escapeHTML = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escapeCSV = (s='') => { const t = String(s); return /[",\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
const money = (n) => '¥' + (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

// 持久层：所有 key 加 wb_pm_ 前缀
const KEY = 'wb_pm_';
const store = {
  get(k, def) { try { const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { console.error('存储失败', e); toast('存储失败：' + e.message, 'danger'); } },
  rm(k) { localStorage.removeItem(KEY + k); },
  clearAll() { Object.keys(localStorage).filter(k => k.startsWith(KEY)).forEach(k => localStorage.removeItem(k)); }
};

// ---------- IndexedDB（健身照片专用） ----------
// 解决 localStorage 5MB 上限：照片 Blob 单独存 IndexedDB（容量几 GB 起步），
// Schema.fitness[].photos[] 只留 {id} 引用，body 数据不再进 localStorage。
const IDB_NAME = 'wb_pm_fit';
const IDB_STORE = 'photos';
const IDB_VERSION = 1;
const idb = {
  _db: null,
  _opening: null,
  open() {
    if (idb._db) return Promise.resolve(idb._db);
    if (idb._opening) return idb._opening;
    if (typeof indexedDB === 'undefined') return Promise.reject(new Error('当前环境不支持 IndexedDB'));
    idb._opening = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(IDB_NAME, IDB_VERSION); }
      catch (e) { idb._opening = null; reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => { idb._db = req.result; idb._opening = null; resolve(req.result); };
      req.onerror = () => { idb._opening = null; reject(req.error || new Error('IDB 打开失败')); };
      req.onblocked = () => { idb._opening = null; reject(new Error('IDB 被阻塞')); };
    });
    return idb._opening;
  },
  async _store(mode) {
    const db = await idb.open();
    return db.transaction(IDB_STORE, mode).objectStore(IDB_STORE);
  },
  put(id, blob) {
    return new Promise((resolve, reject) => {
      idb._store('readwrite').then(s => {
        const r = s.put(blob, id);
        r.onsuccess = () => resolve(id);
        r.onerror = () => reject(r.error || new Error('IDB put 失败'));
      }).catch(reject);
    });
  },
  putMany(entries) { return Promise.all((entries || []).map(([id, blob]) => idb.put(id, blob))); },
  get(id) {
    return new Promise(resolve => {
      idb._store('readonly').then(s => {
        const r = s.get(id);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      }).catch(() => resolve(null));
    });
  },
  del(id) {
    return new Promise(resolve => {
      idb._store('readwrite').then(s => {
        const r = s.delete(id);
        r.onsuccess = () => resolve();
        r.onerror = () => resolve();
      }).catch(() => resolve());
    });
  },
  delMany(ids) { return Promise.all((ids || []).map(id => idb.del(id))); },
  keys() {
    return new Promise(resolve => {
      idb._store('readonly').then(s => {
        const r = s.getAllKeys();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => resolve([]);
      }).catch(() => resolve([]));
    });
  },
  all() {
    return new Promise(resolve => {
      idb._store('readonly').then(s => {
        const r = s.getAll();
        r.onsuccess = () => {
          const kr = s.getAllKeys();
          kr.onsuccess = () => {
            const keys = kr.result || [];
            const blobs = r.result || [];
            resolve(keys.map((k, i) => [k, blobs[i]]));
          };
          kr.onerror = () => resolve([]);
        };
        r.onerror = () => resolve([]);
      }).catch(() => resolve([]));
    });
  },
  clear() {
    return new Promise(resolve => {
      idb._store('readwrite').then(s => {
        const r = s.clear();
        r.onsuccess = () => resolve();
        r.onerror = () => resolve();
      }).catch(() => resolve());
    });
  }
};

// dataURL ↔ Blob 互转（迁移老照片 + 备份导出/导入时用）
function dataURLtoBlob(dataUrl) {
  if (typeof dataUrl !== 'string') return null;
  const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(dataUrl);
  if (!m) return null;
  const mime = m[1] || 'image/jpeg';
  const isBase64 = !!m[2];
  const data = m[3] || '';
  try {
    if (isBase64) {
      const bin = atob(data);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }
    return new Blob([decodeURIComponent(data)], { type: mime });
  } catch (e) { return null; }
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

// 照片 ObjectURL 缓存，避免每个 img 元素都查一次 IDB
const photoUrlCache = new Map();
async function getPhotoUrl(pid) {
  if (!pid) return '';
  if (photoUrlCache.has(pid)) return photoUrlCache.get(pid);
  const blob = await idb.get(pid);
  if (!blob) return '';
  const url = URL.createObjectURL(blob);
  photoUrlCache.set(pid, url);
  return url;
}
function revokeAllPhotoUrls() {
  photoUrlCache.forEach(url => { try { URL.revokeObjectURL(url); } catch {} });
  photoUrlCache.clear();
}
function revokePhotoUrl(pid) {
  const u = photoUrlCache.get(pid);
  if (u) { try { URL.revokeObjectURL(u); } catch {} photoUrlCache.delete(pid); }
}

// 把已经渲染好的 img[data-pid] 异步解析出 src
function resolveFitPhotos(scope) {
  (scope || document).querySelectorAll('img.fit-photo[data-pid]').forEach(img => {
    const pid = img.dataset.pid;
    if (!pid) return;
    if (img.src && img.src.startsWith('blob:')) return;
    getPhotoUrl(pid).then(url => { if (url) img.src = url; else img.alt = '照片丢失'; });
  });
}

  notes: [],     // {id, ts, content, category:'工作'|'生活'|'学习'|'其他', status:'done'|'pending', doneAt?, pendingNextDate?}
  fitness: [],   // {id, date, part, note, photos:[{id, data}]}

};

function loadAll() {
  Object.keys(Schema).forEach(k => {
    const v = store.get(k, null);
    if (v !== null) Schema[k] = v;
  });
  migrateNotes();
}
// 老 notes 仅 {id, ts, content}：全部补 category='其他'、status='done'、doneAt=ts，保留原文
function migrateNotes() {
  let changed = false;
  Schema.notes = (Schema.notes || []).map(n => {
    if (n && n.status && n.category) return n;
    changed = true;
    return Object.assign({}, n, { category: n && n.category ? n.category : '其他', status: 'done', doneAt: n && n.ts ? n.ts : Date.now() });
  });
  if (changed) { try { localStorage.setItem(KEY + 'notes', JSON.stringify(Schema.notes)); } catch {} }
}
function save(key) { store.set(key, Schema[key]); }
function saveAll() { Object.keys(Schema).forEach(save); scheduleAutoBackup(); }

// ---------- 今天要处理 ----------
function renderToday() {
  const ul = $('#today-list'); if (!ul) return;
  const items = [];
  const t = todayStr();

  const todayReview = Schema.reviews.find(r => r.date === t);
  if (!todayReview) {
    items.push({ key:'review-today', label: '今日复盘还没写', meta: '已耗时 ~14h', overdue: true, action: '去写', cb: () => switchTab('review') });
  } else if (!todayReview.done && !todayReview.problem && !todayReview.risk && !todayReview.achievement) {
    items.push({ key:'review-today-empty', label: '今日复盘内容为空', meta: '', overdue: false, action: '补充', cb: () => openReviewModal(todayReview.id) });
  }

  const yestReview = Schema.reviews.find(r => r.date === daysAgo(1));
  if (yestReview && !yestReview.done && !yestReview.problem && !yestReview.risk && !yestReview.achievement) {
    items.push({ key:'review-yest', label: `昨日 (${daysAgo(1)}) 复盘未完成`, meta: '已自动顺延', overdue: true, action: '补', cb: () => openReviewModal(yestReview.id) });
  }

  // 轻记录：pending 待办的"今日要处理"汇总
  const tToday = todayStr();
  const pendNotes = (Schema.notes||[]).filter(n => n.status === 'pending');
  const overdueNotes = pendNotes.filter(n => (n.pendingNextDate || tToday) < tToday);
  if (overdueNotes.length) {
    items.push({ key:'notes-overdue', label: `${overdueNotes.length} 条轻记录待办已逾期`, meta: '已自动顺延', overdue: true, action: '查看', cb: () => { noteFilter.filter = '待办'; switchTab('note'); } });
  }
  const todayNotes = pendNotes.filter(n => (n.pendingNextDate || tToday) === tToday);
  if (todayNotes.length) {
    items.push({ key:'notes-today', label: `${todayNotes.length} 条轻记录待办今天要处理`, meta: '', overdue: false, action: '查看', cb: () => { noteFilter.filter = '待办'; switchTab('note'); } });
  }

  // 健身：今天还没打卡，给个温柔提醒（非逾期）
  if (!Schema.fitness.some(f => f.date === t)) {
    items.push({ key:'fit-today', label: '今天还没健身打卡', meta: '健完身来拍张照 📷', overdue: false, action: '去打卡', cb: () => switchTab('fitness') });
  }

  const totalItems = Schema.reviews.length + Schema.notes.length + Schema.fitness.length;
  if (totalItems >= 30) {
    items.push({ key:'backup', label: `数据已积累 ${totalItems} 条`, meta: '建议导出备份', overdue: false, action: '导出', cb: () => exportAll() });
  }

  if (!items.length) {
    ul.innerHTML = `<li style="border:0;background:transparent;color:var(--success);justify-content:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> 当前一切就绪，继续保持 ✨</li>`;
    return;
  }
  ul.innerHTML = items.map(it => `
    <li class="${it.overdue?'overdue':''}">
      <span class="label">${escapeHTML(it.label)}</span>
      <span class="meta">${escapeHTML(it.meta)}</span>
      <button class="btn sm primary" data-act="${it.key}">${escapeHTML(it.action)}</button>
    </li>
  `).join('');
  ul.onclick = e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const it = items.find(x => x.key === btn.dataset.act);
    if (it) it.cb();
  };
}

// ---------- 复盘 ----------
let reviewFilter = { q: '', tag: '' };
function renderReview() {
  const root = $('#review-list'); if (!root) return;
  let list = [...Schema.reviews];
  if (reviewFilter.q) {
    const q = reviewFilter.q.toLowerCase();
    list = list.filter(r => (r.done + ' ' + (r.problem||'') + ' ' + (r.risk||'') + ' ' + r.achievement + ' ' + (r.tags||[]).join(' ')).toLowerCase().includes(q));
  }
  if (reviewFilter.tag) list = list.filter(r => (r.tags||[]).includes(reviewFilter.tag));
  list.sort((a,b) => b.date.localeCompare(a.date));

  if (!list.length) {
    root.innerHTML = `<div class="empty">还没写过复盘，点上方「新增复盘」开始 ✍️</div>`;
  } else {
    root.innerHTML = list.map(r => `
      <div class="review-item">
        <div class="head">
          <span class="date">${escapeHTML(r.date)}</span>
          <span class="day-tag">${r.date === todayStr() ? '今日' : (r.date === daysAgo(1) ? '昨日' : '')}</span>
          <span class="spacer"></span>
          <button class="btn sm ghost" data-act="edit" data-id="${r.id}">编辑</button>
          <button class="btn sm danger" data-act="del" data-id="${r.id}">删除</button>
        </div>
        ${r.done ? `<div class="section done"><div class="lbl">${iconCheck()} 今日完成</div><div class="body">${escapeHTML(r.done)}</div></div>` : ''}
        ${r.problem ? `<div class="section problem"><div class="lbl">${iconWarn()} 问题（已发生）</div><div class="body">${escapeHTML(r.problem)}</div></div>` : ''}
        ${r.risk ? `<div class="section risk"><div class="lbl">${iconWarn()} 风险（潜在）</div><div class="body">${escapeHTML(r.risk)}</div></div>` : ''}
        ${r.achievement ? `<div class="section achievement"><div class="lbl">${iconStar()} 成果亮点</div><div class="body">${escapeHTML(r.achievement)}</div></div>` : ''}
        ${(r.tags||[]).length ? `<div class="tags">${(r.tags||[]).map(t => `<span class="tag" data-tag="${escapeHTML(t)}">#${escapeHTML(t)}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
  }

  const allTags = Array.from(new Set(Schema.reviews.flatMap(r => r.tags || [])));
  $('#review-tags').innerHTML = `<option value="">全部标签 (${allTags.length})</option>` + allTags.map(t => `<option value="${escapeHTML(t)}" ${reviewFilter.tag===t?'selected':''}>#${escapeHTML(t)}</option>`).join('');

  root.onclick = e => {
    const t = e.target.closest('.tag');
    if (t) { reviewFilter.tag = t.dataset.tag; renderReview(); return; }
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'edit') openReviewModal(btn.dataset.id);
    if (btn.dataset.act === 'del') {
      if (confirm('删除该复盘？此操作不可恢复。')) {
        Schema.reviews = Schema.reviews.filter(x => x.id !== btn.dataset.id);
        save('reviews'); renderAll();
      }
    }
  };
}

          e.preventDefault();
          const v = ti.value.trim().replace(/^#/,'');

function exportReviewAsResume(rangeFrom, rangeTo) {
  const list = Schema.reviews
    .filter(r => r.date >= rangeFrom && r.date <= rangeTo)
    .sort((a,b) => a.date.localeCompare(b.date));
  if (!list.length) { toast('所选时间段没有复盘记录', 'warn'); return; }
  let md = `# 个人成长记录\n\n时间区间：${rangeFrom} ~ ${rangeTo}\n\n`;
  const tagMap = {};
  list.forEach(r => (r.tags||[]).forEach(t => { tagMap[t] = (tagMap[t]||0) + 1; }));
  const tagStats = Object.entries(tagMap).sort((a,b)=>b[1]-a[1]);
  if (tagStats.length) {
    md += `## 标签维度统计\n\n` + tagStats.map(([t,c]) => `- ${t}: ${c} 次`).join('\n') + '\n\n';
  }
  md += `## 时间线\n\n`;
  list.forEach(r => {
    md += `### ${r.date}\n`;
    if (r.done) md += `**完成**：\n${r.done.split('\n').map(l=>'- '+l).join('\n')}\n\n`;
    if (r.problem) md += `**问题**：\n${r.problem}\n\n`;
    if (r.risk) md += `**风险**：\n${r.risk}\n\n`;
    if (r.achievement) md += `**成果**：\n${r.achievement}\n\n`;
    if (r.tags?.length) md += `标签：${r.tags.map(t=>'`'+t+'`').join(' ')}\n\n`;
  });
  downloadFile(`复盘-简历素材-${rangeFrom}_${rangeTo}.md`, md, 'text/markdown');
  toast('简历素材已导出');
}

function generateWeeklyReport() {
  const now = new Date();
  const dow = now.getDay(); // 0=日 6=六
  const monday = new Date(now); monday.setDate(now.getDate() - ((dow + 6) % 7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const from = fmtDate(monday), to = fmtDate(sunday);
  const week = Schema.reviews.filter(r => r.date >= from && r.date <= to).sort((a,b)=>a.date.localeCompare(b.date));
  if (!week.length) { toast(`本周（${from} ~ ${to}）还没有复盘记录`, 'warn'); return; }

  const doneCount = week.reduce((s,r)=>s + (r.done ? r.done.split('\n').filter(Boolean).length : 0), 0);
  const achCount = week.filter(r=>r.achievement).length;
  const probCount = week.filter(r=>r.problem).length;
  const riskCount = week.filter(r=>r.risk).length;
  const tagMap = {};
  week.forEach(r => (r.tags||[]).forEach(t => { tagMap[t] = (tagMap[t]||0)+1; }));
  const topTags = Object.entries(tagMap).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t])=>'`'+t+'`').join(' ');

  let md = `# 周报（${from} ~ ${to}）\n\n`;
  md += `> 自动汇总自「工作复盘」模块，本周共 ${week.length} 天有记录。\n\n`;
  md += `## 一、本周概览\n\n`;
  md += `- 完成事项：约 ${doneCount} 项\n`;
  md += `- 取得成果：${achCount} 天有亮点\n`;
  md += `- 遇到问题（已发生）：${probCount} 天\n`;
  md += `- 潜在风险：${riskCount} 天\n`;
  md += `- 高频标签：${topTags || '—'}\n\n`;
  md += `## 二、每日明细\n\n`;
  week.forEach(r => {
    md += `### ${r.date}\n`;
    if (r.done) md += `**完成**：\n${r.done.split('\n').filter(Boolean).map(l=>'- '+l).join('\n')}\n`;
    if (r.problem) md += `\n**问题**：\n${r.problem}\n`;
    if (r.risk) md += `\n**风险**：\n${r.risk}\n`;
    if (r.achievement) md += `\n**成果**：${r.achievement}\n`;
    if (r.tags?.length) md += `\n标签：${r.tags.map(t=>'`'+t+'`').join(' ')}\n`;
    md += '\n';
  });
  md += `## 三、下周计划（待填）\n\n- \n- \n- \n`;

  showModal(`<h3>本周周报预览</h3>
    <p class="hint">已自动汇总 ${week.length} 天复盘，可复制或下载 Markdown。</p>
    <textarea class="report-area" id="weekly-md">${escapeHTML(md)}</textarea>
    <div class="form-row" style="margin-top:12px">
      <label>本周提炼（必填）</label>
      <textarea id="weekly-distill" class="report-area" style="min-height:90px" placeholder="用一两句话提炼本周最关键的进展、卡点与下一步重心——这是复盘真正的价值所在。"></textarea>
      <p class="hint">未填写「本周提炼」不能复制 / 下载。</p>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="cancel">关闭</button>
      <button class="btn" data-act="copy">复制</button>
      <button class="btn primary" data-act="download">下载 .md</button>
    </div>
  `, {
    onMount: (root) => {
      root.querySelector('[data-act="cancel"]').onclick = closeModal;
      const buildFinal = () => {
        const distill = root.querySelector('#weekly-distill').value.trim();
        if (!distill) { toast('请先填写「本周提炼」再复制 / 下载', 'warn'); return null; }
        return md + `\n## 四、本周提炼\n\n${distill}\n`;
      };
      root.querySelector('[data-act="copy"]').onclick = () => {
        const finalMd = buildFinal(); if (!finalMd) return;
        const ta = root.querySelector('#weekly-md');
        ta.value = finalMd; ta.select();
        try { document.execCommand('copy'); toast('已复制（含本周提炼）'); }
        catch { if (navigator.clipboard) navigator.clipboard.writeText(finalMd).then(()=>toast('已复制')); }
      };
      root.querySelector('[data-act="download"]').onclick = () => {
        const finalMd = buildFinal(); if (!finalMd) return;
        downloadFile(`周报-${from}_${to}.md`, finalMd, 'text/markdown'); toast('已下载（含本周提炼）');
      };
    }
  });
}

// ---------- 轻记录 ----------
const NOTE_CATS = ['工作','生活','学习','其他'];
let noteFilter = { filter: '全部', cat: '工作' }; // filter: 全部|待办；cat: 当前选中分类

function renderNoteCats(root) {
  // 最近使用优先：按 records 中 status=done 的 category 出现次数排
  const counts = { '工作':0,'生活':0,'学习':0,'其他':0 };
  (Schema.notes||[]).forEach(n => { if (n.category && counts[n.category] !== undefined) counts[n.category]++; });
  const order = [...NOTE_CATS].sort((a,b) => counts[b] - counts[a] || NOTE_CATS.indexOf(a) - NOTE_CATS.indexOf(b));
  root.innerHTML = order.map(c => `<button data-c="${c}" class="${c===noteFilter.cat?'active':''}">${c}</button>`).join('');
  root.onclick = e => {
    const b = e.target.closest('button[data-c]'); if (!b) return;
    noteFilter.cat = b.dataset.c;
    renderNotes();
  };
}

function renderNoteFilterTabs(root) {
  root.querySelectorAll('button[data-f]').forEach(b => {
    b.classList.toggle('active', b.dataset.f === noteFilter.filter);
    b.onclick = () => { noteFilter.filter = b.dataset.f; renderNotes(); };
  });
}

function renderNoteStats(root) {
  const t = todayStr();
  const dayCutoff = Date.now() - 7*24*3600*1000;
  let dt = 0, dw = 0, total = 0, pend = 0;
  (Schema.notes||[]).forEach(n => {
    if (n.status === 'done') {
      total++;
      const tms = n.doneAt || n.ts || 0;
      if (fmtDate(tms) === t) dt++;
      if (tms >= dayCutoff) dw++;
    } else if (n.status === 'pending') {
      pend++;
    }
  });
  root.innerHTML = `
    <div class="note-stats">
      <div class="note-stat s-done-today"><span class="num">${dt}</span><span class="lbl">今日已完成</span></div>
      <div class="note-stat s-done-week"><span class="num">${dw}</span><span class="lbl">近 7 天完成</span></div>
      <div class="note-stat s-total"><span class="num">${total}</span><span class="lbl">累计记录</span></div>
      <div class="note-stat s-pending"><span class="num">${pend}</span><span class="lbl">待办剩余</span></div>
    </div>`;
}

function fmtDayGroup(t) {
  const today = todayStr();
  if (t === today) return { label: '今天', key: 'today' };
  if (t === daysAgo(1)) return { label: '昨天', key: 'yesterday' };
  return { label: t, key: t };
}

function renderNoteList(root) {
  let items = [...(Schema.notes||[])];
  if (noteFilter.filter === '待办') items = items.filter(n => n.status === 'pending');
  // 排序：pending 优先（到期在前），然后 ts 倒序
  items.sort((a,b) => {
    const pa = a.status === 'pending' ? 0 : 1;
    const pb = b.status === 'pending' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    const ax = a.status==='pending' ? (a.pendingNextDate||'') : fmtDate(a.doneAt || a.ts);
    const bx = b.status==='pending' ? (b.pendingNextDate||'') : fmtDate(b.doneAt || b.ts);
    return bx.localeCompare(ax) || (b.id||'').localeCompare(a.id||'');
  });
  if (!items.length) {
    root.innerHTML = `<div class="note-empty">${noteFilter.filter==='待办' ? '没有待办 🎉' : '还没有轻记录，写下第一句 ✏️'}</div>`;
    return;
  }
  // 按日期分组键（pending 用 pendingNextDate，done 用 doneAt 日期）
  const groups = new Map();
  items.forEach(n => {
    const t = n.status === 'pending' ? (n.pendingNextDate || todayStr()) : fmtDate(n.doneAt || n.ts);
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(n);
  });
  const t = todayStr();
  const dAgo1 = daysAgo(1);
  let dayMetaHtml = (gDate) => {
    if (gDate === t) return { meta: '今天', fresh: true };
    if (gDate === dAgo1) {
      const done = (Schema.notes||[]).filter(n => n.status==='done' && fmtDate(n.doneAt||n.ts) === gDate).length;
      const total = done + (Schema.notes||[]).filter(n => n.status==='pending' && n.pendingNextDate===gDate).length;
      return { meta: `${done} 完成 / ${total} 条` };
    }
    const done = (Schema.notes||[]).filter(n => n.status==='done' && fmtDate(n.doneAt||n.ts) === gDate).length;
    return { meta: `${done} 完成` };
  };
  let html = '';
  for (const [gDate, list] of groups) {
    const g = fmtDayGroup(gDate);
    const m = dayMetaHtml(gDate);
    const overdueTag = gDate < t ? `<span style="color:var(--danger);font-weight:600">已逾期</span> · ` : '';
    html += `<div class="note-day"><div class="note-day-head"><span class="h">${escapeHTML(g.label)}</span><span class="meta">${m.fresh ? '' : overdueTag}${escapeHTML(m.meta)}</span><span class="hr"></span></div>`;
    list.forEach(n => {
      const isDone = n.status === 'done';
      const overdue = !isDone && (n.pendingNextDate || todayStr()) < t;
      html += `
        <div class="note-row ${isDone?'done':''}" data-id="${n.id}">
          <button class="check-btn ${isDone?'done':''}" data-act="toggle" title="${isDone?'标记为待办':'标记为已完成'}">
            ${isDone ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>` : ''}
          </button>
          <div class="body">
            <div class="text">${escapeHTML(n.content)}</div>
            <div class="meta-row">
              <span class="cat-pill">${escapeHTML(n.category || '其他')}</span>
              ${isDone ? '' : `<span class="pending-tag ${overdue?'overdue':''}">⏱ ${overdue?'逾期待办':'待办'}${n.pendingNextDate ? ' · 顺延到 ' + escapeHTML(n.pendingNextDate) : ''}</span>`}
              ${isDone ? `<span class="hint" style="font-size:12px">${escapeHTML(fmtHM(new Date(n.doneAt || n.ts)))}</span>` : ''}
              ${isDone ? '' : `<button class="defer-btn" data-act="defer" title="顺延到明天">顺延一天</button>`}
            </div>
          </div>
          <button class="x" data-act="del" title="删除">${iconX()}</button>
        </div>`;
    });
    html += `</div>`;
  }
  root.innerHTML = html;
  root.onclick = e => {
    const row = e.target.closest('.note-row'); if (!row) return;
    const id = row.dataset.id;
    const n = (Schema.notes||[]).find(x => x.id === id); if (!n) return;
    const btn = e.target.closest('button[data-act]');
    if (btn && btn.dataset.act === 'toggle') {
      if (n.status === 'done') {
        n.status = 'pending';
        n.pendingNextDate = n.pendingNextDate || todayStr();
        delete n.doneAt;
      } else {
        n.status = 'done';
        n.doneAt = Date.now();
        delete n.pendingNextDate;
      }
      save('notes'); renderNotes(); renderToday();
      return;
    }
    if (btn && btn.dataset.act === 'defer') {
      const d = new Date(n.pendingNextDate || todayStr());
      d.setDate(d.getDate() + 1);
      n.pendingNextDate = d.toISOString().slice(0,10);
      save('notes'); renderNotes(); renderToday();
      return;
    }
    if (btn && btn.dataset.act === 'del') {
      if (!confirm('删除这条轻记录？')) return;
      Schema.notes = Schema.notes.filter(x => x.id !== id);
      save('notes'); renderNotes(); renderToday();
      return;
    }
  };
}

function renderNotes() {
  const stats = $('#note-stats-card'); if (!stats) return;
  const cats = $('#note-cats');
  const filter = $('#note-filter');
  const list = $('#note-list');
  renderNoteStats(stats);
  if (cats) renderNoteCats(cats);
  if (filter) renderNoteFilterTabs(filter);
  renderNoteList(list);
}

function fmtHM(d) {
  if (fmtDate(d) === todayStr()) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// 当前草稿照片（未保存）
let fitDraft = [];

function initFitCompose() {
  const d = $('#fit-date'); if (d) d.value = todayStr();
  ['fit-camera', 'fit-album'].forEach(id => {
    const f = $('#' + id);
    if (!f) return;
    f.onchange = () => {
      const files = Array.from(f.files || []);
      const room = 9 - fitDraft.length;
      if (room <= 0) { toast('最多 9 张照片', 'warn'); f.value = ''; return; }
      const picked = files.slice(0, room);
      if (!picked.length) { f.value = ''; return; }
      let done = 0;
      picked.forEach(file => {
        compressImageBlob(file, 800, 0.82).then(blob => {
          fitDraft.push({ id: uid(), blob });
        }).catch(() => {}).finally(() => {
          done++;
          if (done === picked.length) { renderFitDraft(); f.value = ''; }
        });
      });
    };
  });
  renderFitDraft();
}

function compressImageBlob(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try {
        canvas.toBlob(b => {
          if (b) resolve(b); else reject(new Error('压缩失败'));
        }, 'image/jpeg', quality);
      } catch (e) { reject(e); }
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e || new Error('图片解码失败')); };
    img.src = url;
  });
}

function renderFitDraft() {
  // 给每张草稿生成 ObjectURL（避免立刻 revoke 闪烁）
  fitDraft.forEach(p => { if (!p.url && p.blob) p.url = URL.createObjectURL(p.blob); });
  const box = $('#fit-photos'); if (!box) return;
  box.innerHTML = fitDraft.map(p => `
    <div class="fit-thumb">
      <img src="${p.url || ''}" alt="打卡照片草稿" />
      <button class="fit-thumb-x" data-id="${p.id}" title="移除">×</button>
    </div>`).join('');
  const hint = $('#fit-photo-hint'); if (hint) hint.textContent = `已选 ${fitDraft.length}/9 张，自动压缩（IndexedDB 存储）`;
  box.onclick = e => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const removed = fitDraft.find(x => x.id === b.dataset.id);
    if (removed && removed.url) { try { URL.revokeObjectURL(removed.url); } catch {} }
    fitDraft = fitDraft.filter(x => x.id !== b.dataset.id);
    renderFitDraft();
  };
}

async function saveCheckIn() {
  const date = ($('#fit-date')?.value || todayStr());
  const part = ($('#fit-part')?.value || '').trim();
  const note = ($('#fit-note')?.value || '').trim();
  if (!note && !part && !fitDraft.length) { toast('写点什么或加张照片吧', 'warn'); return; }
  if (!fitDraft.length) {
    // 纯文字记录：照旧走老路径即可
    Schema.fitness.unshift({ id: uid(), date, part, note, photos: [] });
    save('fitness');
    if ($('#fit-part')) $('#fit-part').value = '';
    if ($('#fit-note')) $('#fit-note').value = '';
    if ($('#fit-date')) $('#fit-date').value = todayStr();
    renderFitness(); renderToday();
    toast('打卡已保存');
    return;
  }
  const photoIds = fitDraft.map(p => p.id);
  const newRecordId = uid();
  // 1) 记录先入 Schema，再异步写 IDB。万一 IDB 写失败，回滚 Schema
  Schema.fitness.unshift({ id: newRecordId, date, part, note, photos: photoIds.map(id => ({ id })) });
  try {
    await idb.putMany(fitDraft.map(p => [p.id, p.blob]));
  } catch (e) {
    Schema.fitness = Schema.fitness.filter(x => x.id !== newRecordId);
    toast('照片保存失败：' + (e && e.message ? e.message : e), 'danger');
    return;
  }
  save('fitness');
  // 释放草稿 ObjectURL，清空 fitDraft
  fitDraft.forEach(p => { if (p.url) { try { URL.revokeObjectURL(p.url); } catch {} } });
  fitDraft = [];
  if ($('#fit-part')) $('#fit-part').value = '';
  if ($('#fit-note')) $('#fit-note').value = '';
  if ($('#fit-date')) $('#fit-date').value = todayStr();
  renderFitDraft(); renderFitness(); renderToday();
  toast('打卡已保存');
}

function inThisWeek(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = (d.getDay() + 6) % 7; // 周一=0
  const monday = new Date(d); monday.setDate(d.getDate() - day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 7);
  return d >= monday && d < sunday;
}

function prevDate(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

function renderFitness() {
  const root = $('#fit-list'); if (!root) return;
  const all = Schema.fitness;
  const daySet = new Set(all.map(f => f.date));
  const totalDays = daySet.size;
  const weekCount = all.filter(f => inThisWeek(f.date)).length;
  const totalPhotos = all.reduce((s, f) => s + (f.photos ? f.photos.length : 0), 0);
  // 连续天数：今天有打卡从今天算，否则从昨天起算，给连续激励
  let streak = 0;
  let cursor = daySet.has(todayStr()) ? todayStr() : daysAgo(1);
  while (daySet.has(cursor)) { streak++; cursor = prevDate(cursor, 1); }
  $('#fit-stats').innerHTML = `
    <div class="note-stats">
      <div class="note-stat s-total"><span class="num">${totalDays}</span><span class="lbl">累计打卡</span></div>
      <div class="note-stat s-reading"><span class="num">${weekCount}</span><span class="lbl">本周</span></div>
      <div class="note-stat s-wish"><span class="num">${streak}</span><span class="lbl">连续天数</span></div>
      <div class="note-stat s-done"><span class="num">${totalPhotos}</span><span class="lbl">累计照片</span></div>
    </div>`;
  if (!all.length) { root.innerHTML = `<div class="empty">还没有健身打卡，健完身来拍张照吧 📷</div>`; return; }
  root.innerHTML = [...all].sort((a, b) => b.date.localeCompare(a.date)).map(f => `
    <div class="card fit-item">
      <div class="fit-item-head">
        <span class="date">${escapeHTML(f.date)} ${f.date === todayStr() ? '<span class="day-tag">今日</span>' : (f.date === daysAgo(1) ? '<span class="day-tag">昨日</span>' : '')}</span>
        ${f.part ? `<span class="tag">#${escapeHTML(f.part)}</span>` : ''}
        <span class="spacer"></span>
        <button class="btn sm danger" data-act="del" data-id="${f.id}">${iconX()}</button>
      </div>
      ${f.note ? `<div class="fit-note">${escapeHTML(f.note)}</div>` : ''}
      ${f.photos && f.photos.length ? `<div class="fit-photos" data-fid="${f.id}">${f.photos.map(p => `<img class="fit-photo" data-fid="${f.id}" data-pid="${p.id}" alt="打卡照片" />`).join('')}</div>` : ''}
    </div>
  `).join('');
  // 异步从 IDB 解析每张照片的实际 src
  resolveFitPhotos(root);
  root.onclick = e => {
    const del = e.target.closest('button[data-act="del"]');
    if (del) {
      const id = del.dataset.id;
      const rec = Schema.fitness.find(x => x.id === id);
      const photoIds = (rec && rec.photos) ? rec.photos.map(p => p.id).filter(Boolean) : [];
      if (confirm('删除这条打卡记录？照片将一并删除。')) {
        Schema.fitness = Schema.fitness.filter(x => x.id !== id);
        save('fitness');
        photoIds.forEach(pid => revokePhotoUrl(pid));
        idb.delMany(photoIds).catch(() => {});
        renderFitness(); renderToday();
      }
      return;
    }
    const img = e.target.closest('img.fit-photo');
    if (img) {
      const pid = img.dataset.pid;
      getPhotoUrl(pid).then(url => {
        if (url) showModal(`<img src="${url}" style="width:100%;border-radius:10px;display:block" alt="打卡照片" />`);
        else toast('照片已丢失，可能在新设备/清缓存后未导入', 'warn');
      });
    }
  };
}

function renderXunjiEval() {
  const box = $('#xunji-cards'); if (!box) return;
  const meta = $('#xunji-meta');
  if (typeof fetch !== 'function') {
    box.innerHTML = `<div class="xunji-loading">当前环境不支持自动加载（请用现代浏览器打开部署页）。</div>`;
    return;
  }
  box.innerHTML = `<div class="xunji-loading">正在加载训记评价…</div>`;
  fetch('xunji_eval.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      if (meta) meta.textContent = `数据区间 ${d.range[0]} ~ ${d.range[1]} · 训练日 ${d.train_days}`;
      const ORDER = ['手臂', '胸', '肩膀', '腿', '背'];
      box.innerHTML = ORDER.map(p => {
        const it = d.parts[p]; if (!it) return '';
        const m = it.metrics;
        return `<div class="xunji-card" style="border-top:3px solid ${it.color}">
          <div class="xunji-card-img">${it.svg}</div>
          <div class="xunji-card-body">
            <div class="xunji-card-title">${p}<span class="xunji-sub">训练日 ${m.days} · 动作 ${m.distinct} 种 · 组 ${m.sets}</span></div>
            <div class="xunji-tag s"><b>优势</b>${escapeHTML(it.strength)}</div>
            <div class="xunji-tag w"><b>劣势</b>${escapeHTML(it.weakness)}</div>
            <div class="xunji-tag a"><b>建议</b>${escapeHTML(it.advice)}</div>
          </div>
        </div>`;
      }).join('');
      const planBox = $('#xunji-plan');
      if (planBox && d.enhancement) planBox.innerHTML = renderXunjiPlan(d.enhancement);
    })
    .catch(err => {
      box.innerHTML = `<div class="xunji-loading">暂无可加载的训记评价（${escapeHTML(err.message)}）。<br>部署后打开本页即可自动加载。</div>`;
    });
}

function renderXunjiPlan(e) {
  const ORDER = ['手臂', '胸', '肩膀', '腿', '背'];
  const parts = e.parts || {};
  const secs = ORDER.filter(p => parts[p]).map(p => {
    const info = parts[p];
    const rows = info.items.map(it => {
      const w = (it.last_w > 0 && it.target_w > 0)
        ? `${fmtW(it.last_w)}→<b>${fmtW(it.target_w)}</b>kg`
        : (it.target_w > 0 ? `新增 <b>${fmtW(it.target_w)}</b>kg` : '自重');
      const tag = it.is_new ? '<span class="xunji-new">新·哑铃</span>' : '';
      return `<div class="xunji-plan-row">
        <span class="xunji-pa">${escapeHTML(it.action)}</span>
        <span class="xunji-pw">${w}</span>
        <span class="xunji-pr">${it.sets}组×${it.reps}</span>
        ${tag}
      </div>`;
    }).join('');
    return `<div class="xunji-plan-sec">
      <div class="xunji-plan-sec-h" style="color:${info.color}">${p}</div>
      ${rows}
    </div>`;
  }).join('');
  const tip = e.tip ? `<div class="xunji-plan-tip">${escapeHTML(e.tip)}</div>` : '';
  return `<div class="xunji-plan-head">本周增强建议 <span class="hint">${escapeHTML(e.week_range || '')}</span></div>${secs}${tip}`;
}
function fmtW(w) { return (w % 1 === 0) ? String(w) : String(Math.round(w * 10) / 10); }

function renderNews() {

  if (!Schema.news.length) {
    root.innerHTML = `<div class="empty">还没有资讯速览。点击右上角「导入今日速览」加载由 WorkBuddy 每日自动抓取的政经与基金热点。</div>`;
    return;
  }
  const list = [...Schema.news].sort((a,b) => (b.date+(b.ts||0)).localeCompare(a.date+(a.ts||0)));
  const byDate = {};
  list.forEach(n => { (byDate[n.date] = byDate[n.date] || []).push(n); });
  root.innerHTML = Object.entries(byDate).map(([date, arr]) => `
    <div class="card">
      <h2>${date}</h2>
      ${arr.map(n => `
        <div class="news-item">
          <div class="head">
            <span class="cat">${escapeHTML(n.category || '资讯')}</span>
            ${n.source ? `<span class="src">${escapeHTML(n.source)}</span>` : ''}
            ${n.url ? `<a class="src" href="${escapeHTML(n.url)}" target="_blank" rel="noopener">原文 ↗</a>` : ''}
            <span class="ts">${n.ts ? fmtHM(new Date(n.ts)) : ''}</span>
          </div>
          <div class="ttl">${escapeHTML(n.title || '(无标题)')}</div>
          ${n.summary ? `<p class="sm">${escapeHTML(n.summary)}</p>` : ''}
          <div class="row" style="margin-top:6px;justify-content:flex-end">
            <button class="btn sm ghost" data-del="${n.id}">${iconX()}</button>
          </div>
        </div>
      `).join('')}

  `).join('');
  root.onclick = e => {
    const d = e.target.closest('button[data-del]'); if (!d) return;
    Schema.news = Schema.news.filter(n => n.id !== d.dataset.del);
    save('news'); renderNews();
  };
}

// ---------- 本地文件夹自动备份（File System Access API） ----------
// 仅桌面版 Chrome / Edge 支持；纯本地写文件，零网络、零账号，最隐私的备份方式。
const FSA_SUPPORTED = ('showDirectoryPicker' in window);
let autoBackupOn = false;
let autoBackupDirName = '';
let _backupTimer = null;

function _fsaDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('wb_pm_fsa', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('handles')) r.result.createObjectStore('handles'); };
    r.onerror = () => rej(r.error);
    r.onsuccess = () => res(r.result);
  });
}
async function _fsaSaveHandle(h) {
  const db = await _fsaDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(h, 'backupDir');
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function _fsaLoadHandle() {
  const db = await _fsaDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get('backupDir');
    req.onsuccess = () => res(req.result || null);
    tx.onerror = () => rej(tx.error);
  });
}
async function _fsaVerifyPermission(handle, writable = true) {
  const opts = writable ? { writable: true } : {};
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
  } catch (e) { /* 无手势时 requestPermission 可能抛错，忽略 */ }
  return false;
}
async function _fsaWrite(handle, filename, content) {
  if (!(await _fsaVerifyPermission(handle, true))) return false;
  const fh = await handle.getFileHandle(filename, { create: true });
  const w = await fh.createWritable();
  await w.write(content);
  await w.close();
  return true;
}
// 备份导出：Schema + IDB 里的所有照片（base64 形式打包进 __photos），
// 保证换设备/重置缓存后通过导入也能完整还原照片。
async function backupPayload() {
  const photos = {};
  try {
    const entries = await idb.all();
    for (const [pid, blob] of entries) {
      if (!blob) continue;
      try { photos[pid] = await blobToDataURL(blob); } catch {}
    }
  } catch (e) { console.warn('打包 IDB 照片失败', e); }
  return {
    app: 'xiaotai-workbench',
    version: 2,
    exportedAt: new Date().toISOString(),
    data: Schema,
    __photos: photos
  };
}
async function backupPayloadString() { return JSON.stringify(await backupPayload(), null, 2); }
async function writeAutoBackupFile() {
  const content = await backupPayloadString();
  const handle = await _fsaLoadHandle();
  if (!handle) return false;
  return _fsaWrite(handle, 'workbench-backup-latest.json', content);
}
function scheduleAutoBackup() {
  if (!autoBackupOn || !FSA_SUPPORTED) return;
  clearTimeout(_backupTimer);
  _backupTimer = setTimeout(async () => {
    try {
      const ok = await writeAutoBackupFile();
      if (!ok) {
        autoBackupOn = false;
        localStorage.setItem('wb_pm_autobackup', '0');
        toast('本地文件夹备份权限失效，已暂停。请在「安全」里重新绑定。', 'warn');
        updateAutoBackupUI();
      }
    } catch (e) { console.warn('auto backup failed', e); }
  }, 1000);
}
async function enableAutoBackup() {
  if (!FSA_SUPPORTED) { toast('当前浏览器不支持：请用桌面版 Chrome / Edge', 'warn'); return; }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await _fsaSaveHandle(handle);
    autoBackupOn = true;
    autoBackupDirName = handle.name;
    localStorage.setItem('wb_pm_autobackup', '1');
    const ok = await writeAutoBackupFile();
    toast(ok ? `已绑定文件夹「${handle.name}」，自动备份开启` : '已绑定，但首次写入失败（权限？）', ok ? 'ok' : 'warn');
    updateAutoBackupUI();
  } catch (e) {
    if (e && e.name === 'AbortError') return; // 用户取消选择
    toast('绑定失败：' + (e && e.message || e), 'danger');
  }
}
function disableAutoBackup() {
  autoBackupOn = false;
  localStorage.setItem('wb_pm_autobackup', '0');
  updateAutoBackupUI();
  toast('已暂停本地自动备份');
}
function manualBackupNow() {
  if (!FSA_SUPPORTED) { toast('当前浏览器不支持：请用桌面版 Chrome / Edge', 'warn'); return; }
  (async () => {
    const handle = await _fsaLoadHandle();
    if (!handle) { await enableAutoBackup(); return; }
    const content = await backupPayloadString();
    const ok = await _fsaWrite(handle, `workbench-backup-${todayStr()}.json`, content);
    if (ok) toast('已手动备份一份到文件夹');
    else toast('写入失败，请重新绑定文件夹', 'warn');
  })();
}
function updateAutoBackupUI() {
  if (document.querySelector('.modal-mask .modal')) showDataSecurity();
}
function mountAutoBackup(root) {
  const en = root.querySelector('#ab-btn-enable');
  if (en) en.onclick = enableAutoBackup;
  const dis = root.querySelector('#ab-btn-disable');
  if (dis) dis.onclick = disableAutoBackup;
  const now = root.querySelector('#ab-btn-now');
  if (now) now.onclick = manualBackupNow;
  const reb = root.querySelector('#ab-btn-rebind');
  if (reb) reb.onclick = enableAutoBackup; // 重新选文件夹即更换绑定
}
function autoBackupSectionHTML() {
  if (!FSA_SUPPORTED) {
    return `<div class="ab-box">

      <p class="hint">当前浏览器不支持此功能（File System Access API 仅桌面版 Chrome / Edge 可用，Safari / Firefox / 手机浏览器不支持）。你仍可用顶部「导出」按钮手动备份。</p>

          ? `<button class="btn sm" id="ab-btn-now">立即备份一次</button><button class="btn sm" id="ab-btn-rebind">更换文件夹</button><button class="btn sm danger" id="ab-btn-disable">暂停</button>`
          : `<button class="btn sm primary" id="ab-btn-enable">选择备份文件夹</button>`}

  showModal(`<h3>导入备份恢复数据</h3>

        reader.readAsText(f);

      root.querySelector('[data-act="save"]').onclick = async () => {
        const txt = root.querySelector('#imp-json').value.trim();
        if (!txt) { toast('请提供 JSON 内容', 'warn'); return; }
        let data; try { data = JSON.parse(txt); } catch (err) { toast('JSON 解析失败：' + err.message, 'danger'); return; }
        const incoming = data.data || data;
        const photoBag = (data && data.__photos && typeof data.__photos === 'object') ? data.__photos : {};
        const mode = (root.querySelector('input[name="imp-mode"]:checked') || {}).value || 'merge';
        const merge = (cur, inc) => {
          if (Array.isArray(cur) && Array.isArray(inc)) {
            const map = new Map(cur.map(x => [x.id || JSON.stringify(x), x]));
            inc.forEach(x => map.set(x.id || JSON.stringify(x), x));
            return Array.from(map.values());
          }
          if (cur && typeof cur === 'object' && inc && typeof inc === 'object') return { ...cur, ...inc };
          return inc;
        };
        const restorePhotos = async () => {
          const ids = Object.keys(photoBag);
          if (!ids.length) return 0;
          if (mode === 'overwrite') { try { await idb.clear(); } catch {} }
          let ok = 0;
          const entries = [];
          for (const pid of ids) {
            const blob = dataURLtoBlob(photoBag[pid]);
            if (blob) entries.push([pid, blob]);
          }
          try {
            await idb.putMany(entries);
            ok = entries.length;
          } catch (e) { console.warn('导入照片部分失败', e); }
          return ok;
        };
        const apply = async () => {
          let count = 0;
          Object.keys(Schema).forEach(k => {
            if (incoming[k] === undefined) return;
            Schema[k] = (mode === 'overwrite') ? incoming[k] : merge(Schema[k], incoming[k]);

          const snap = { app: 'xiaotai-workbench-snapshot', version: 1, exportedAt: new Date().toISOString(), note: '覆盖导入前的本机数据快照（可重新导入恢复）', data: JSON.parse(JSON.stringify(Schema)) };
          downloadFile(`workbench-本机快照-${todayStr()}.json`, JSON.stringify(snap, null, 2), 'application/json');

            <p style="color:var(--danger);font-size:13px">覆盖将清空本机现有全部数据，用备份完全替换。本机独有、而备份中没有的数据将永久丢失。</p>
            <div class="actions">
              <button class="btn ghost" data-act="cancel">取消</button>
              <button class="btn danger" data-act="ok">确认覆盖</button>

              r2.querySelector('[data-act="ok"]').onclick = () => { apply(); };
            }
          });
          return;
        }
        apply();
      };
    }
  });
}

function downloadFile(name, content, mime='text/plain') {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}

// ---------- 模态框 ----------
function showModal(html, opts={}) {
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask show';
  mask.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(mask);
  mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  if (opts.onMount) opts.onMount(mask.querySelector('.modal'));
}
function closeModal() { $$('.modal-mask').forEach(m => m.remove()); }

// ---------- Toast ----------
function toast(msg, kind='') {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + var(--safe-bottom));transform:translateX(-50%);background:${kind==='danger'?'#e5484d':kind==='warn'?'#f59e0b':'#111827'};color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .15s`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.style.opacity = '1');
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); }, 1800);
}

// ---------- 主渲染 ----------
function render(tab) {
  if (tab === 'today' || !tab) renderToday();
  if (tab === 'review' || !tab) renderReview();
  if (tab === 'note' || !tab) renderNotes();
  if (tab === 'fitness' || !tab) { renderFitness(); renderXunjiEval(); }
  if (tab === 'news' || !tab) { renderNewsSources(); renderNews(); }
}

function renderAll() { render(currentTab); renderTabs(); }

// ---------- 顶部操作栏 ----------
function bindHeaderActions() {
  const header = $('.app-actions');
  header.innerHTML = `
    <button class="btn sm" id="btn-lock" title="锁定 / 启用手令锁">${iconLock()}<span class="long-text">锁</span></button>
    <button class="btn sm" id="btn-export" title="导出全部数据 JSON 备份">${iconDownload()}<span class="long-text">导出</span></button>
    <button class="btn sm" id="btn-import" title="导入 JSON 备份">${iconUpload()}<span class="long-text">导入</span></button>
    <button class="btn sm" id="btn-data" title="数据存放方式与隐私说明">${iconShield()}<span class="long-text">安全</span></button>
    <button class="btn sm danger" id="btn-clear" title="清空全部数据">${iconTrash()}</button>
  `;
  $('#btn-lock').onclick = () => { if (isLockSet()) lockNow(); else showLock(); };
  $('#btn-export').onclick = () => exportAll();
  $('#btn-import').onclick = importAll;
  $('#btn-data').onclick = showDataSecurity;
  $('#btn-clear').onclick = clearAll;
}

function bindModuleActions() {
  $('#review-add')?.addEventListener('click', () => openReviewModal(null));
  $('#review-search')?.addEventListener('input', e => { reviewFilter.q = e.target.value; renderReview(); });
  $('#review-tags')?.addEventListener('change', e => { reviewFilter.tag = e.target.value; renderReview(); });
  $('#review-export-resume')?.addEventListener('click', () => {
    const from = prompt('开始日期 (YYYY-MM-DD)', daysAgo(90));
    const to = prompt('结束日期 (YYYY-MM-DD)', todayStr());
    if (from && to) exportReviewAsResume(from, to);
  });
  $('#review-weekly')?.addEventListener('click', generateWeeklyReport);

  const nt = $('#note-text');
  const grabContent = () => {
    const ta = $('#note-text'); if (!ta) return '';
    return ta.value.trim();
  };
  const clearAndRender = () => { nt.value = ''; renderNotes(); renderToday(); };
  const addAs = (status) => {
    const v = grabContent(); if (!v) return;
    const item = {
      id: uid(), ts: Date.now(), content: v,
      category: noteFilter.cat || '其他', status,
    };
    if (status === 'done') {
      item.doneAt = Date.now();
    } else {
      item.pendingNextDate = todayStr();
    }
    Schema.notes.unshift(item);
    save('notes'); clearAndRender();
    toast(status === 'done' ? '已记为已完成' : '已先惦记着');
  };
  $('#note-add-done')?.addEventListener('click', () => addAs('done'));
  $('#note-add-pending')?.addEventListener('click', () => addAs('pending'));
  nt?.addEventListener('keydown', e => {
    // 回车 = 走默认「已完成」；Shift/Cmd+Enter 走惦记着
    if (e.key === 'Enter' && !e.shiftKey && !e.metaKey) {
      if (e.isComposing) return;
      e.preventDefault();
      if (e.altKey) addAs('pending'); else addAs('done');
    }
  });


  $('#fit-save')?.addEventListener('click', saveCheckIn);
  $('#xunji-refresh')?.addEventListener('click', renderXunjiEval);
  initFitCompose();

  $('#news-import')?.addEventListener('click', openNewsImport);
  $('#news-note-save')?.addEventListener('click', () => {
    const v = ($('#news-note')?.value || '').trim();
    Schema.newsNotes = v; save('newsNotes'); toast('速览手记已保存');
  });
  $('#news-clear')?.addEventListener('click', () => {
    if (!Schema.news.length) { toast('暂无资讯', 'warn'); return; }
    if (confirm(`清空全部 ${Schema.news.length} 条资讯？`)) { Schema.news = []; save('news'); renderNews(); toast('已清空'); }
  });
}

// ---------- 本地口令锁 ----------
const LOCK_KEY = 'lock';
function lockHash(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv' + h.toString(36);
}
function getLockHash() { return store.get(LOCK_KEY, null); }
function isLockSet() { return !!getLockHash(); }
function setLockPass(p) { store.set(LOCK_KEY, lockHash(p)); }
function verifyPass(p) { return lockHash(p) === getLockHash(); }

function showLock() {
  const ls = $('#lock-screen'); if (!ls) return;
  if (isLockSet()) {
    $('#lock-set').style.display = 'none';
    $('#lock-enter').style.display = '';
    $('#lock-pass').value = '';
    $('#lock-err').textContent = '';
    setTimeout(() => $('#lock-pass')?.focus(), 50);
  } else {
    $('#lock-set').style.display = '';
    $('#lock-enter').style.display = 'none';
    $('#lock-pass1').value = '';
    $('#lock-pass2').value = '';
  }
  ls.classList.add('show');
  document.body.classList.add('locked');
}
function hideLock() {
  $('#lock-screen')?.classList.remove('show');
  document.body.classList.remove('locked');
}
function lockNow() { showLock(); }

function bindLockUI() {
  $('#lock-set-btn')?.addEventListener('click', () => {
    const p1 = ($('#lock-pass1')?.value || '').trim();
    const p2 = ($('#lock-pass2')?.value || '').trim();
    if (p1.length < 4 || p1.length > 32) { toast('口令需 4–32 位', 'warn'); return; }
    if (p1 !== p2) { toast('两次输入不一致', 'warn'); return; }
    setLockPass(p1); hideLock(); toast('口令锁已启用');
  });
  $('#lock-skip')?.addEventListener('click', () => hideLock());
  $('#lock-unlock-btn')?.addEventListener('click', () => {
    const p = ($('#lock-pass')?.value || '');
    if (verifyPass(p)) { hideLock(); toast('已解锁'); }
    else { $('#lock-err').textContent = '口令错误，请重试'; }
  });
  $('#lock-pass')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#lock-unlock-btn').click(); });
  $('#lock-forget')?.addEventListener('click', () => {
    if (confirm('将清空全部本地数据并移除口令，此操作不可恢复。\n确定要重置吗？')) {
      const c = prompt('请输入 CLEAR 以确认清空：');
      if (c === 'CLEAR') { store.clearAll(); location.reload(); }
      else if (c !== null) toast('未输入 CLEAR，已取消', 'warn');
    }
  });
}

// ---------- 启动 ----------
// 一次性迁移：localStorage 里 fitness.photos[] 残留的 base64 → 搬到 IndexedDB。
// 完成后 schema.photos 项收缩为 {id}，不再含 data 字段，从根本上避免再次撑爆 localStorage。
async function migrateFitPhotos() {
  if (localStorage.getItem('wb_pm_fit_migrated') === '1') return;
  let movedCount = 0;
  let touched = false;
  const tasks = [];
  Schema.fitness.forEach(f => {
    if (!Array.isArray(f.photos)) return;
    const newPhotos = [];
    f.photos.forEach(p => {
      if (!p || typeof p !== 'object') return;
      if (typeof p.data === 'string') {
        const blob = dataURLtoBlob(p.data);
        if (blob) {
          tasks.push(idb.put(p.id, blob).then(() => { movedCount++; }).catch(() => {}));
        }
        newPhotos.push({ id: p.id });
        touched = true;
      } else if (p.id) {
        newPhotos.push({ id: p.id });
      }
    });
    if (touched) f.photos = newPhotos;
  });
  if (tasks.length) await Promise.all(tasks);
  if (touched) {
    try { save('fitness'); } catch (e) { console.warn('迁移后保存失败', e); }
    // 触发一次 store.set 内的 quota 兜底：未来再写会因瘦身后不再超限而顺利成功
    toast(`已迁移 ${movedCount} 张照片到本地大容量存储`, 'ok', 2500);
  }
  localStorage.setItem('wb_pm_fit_migrated', '1');
  console.log('[migrateFitPhotos]', { moved: movedCount, touched });
}

async function init() {
  loadAll();
  // 仅“首次运行（本地存储完全没有任何 wb_pm_ 数据）”才预置示例，
  // 避免“复盘为空 / 未 onboarded”就误把用户真实数据重置成示例数据
  const firstRun = !Object.keys(localStorage).some(k => k.startsWith(KEY));
  if (firstRun) seedSample();
  bindHeaderActions();
  bindModuleActions();
  bindLockUI();
  renderTabs();
  renderAll();
  currentTab = 'today';
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-today'));
  renderTabs();

  // 老照片迁移：在所有渲染之后异步进行，不阻塞首屏
  if (Schema.fitness && Schema.fitness.length) {
    Promise.resolve().then(() => migrateFitPhotos().catch(e => console.warn('migrate failed', e))).then(() => {
      // 迁移后再渲染一次，确保 src 已经走 IDB
      const fitnessTabActive = $('#view-fitness')?.classList.contains('active');
      if (fitnessTabActive) renderFitness();
    });
  }

  if (isLockSet()) showLock(); else hideLock();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW 注册失败', err));
    });
  }

  // 初始化本地自动备份状态（不阻塞渲染）：若此前已开启且目录句柄仍在，则恢复
  if (FSA_SUPPORTED && localStorage.getItem('wb_pm_autobackup') === '1') {
    _fsaLoadHandle().then(h => {
      if (h) { autoBackupOn = true; autoBackupDirName = h.name; }
      else { localStorage.setItem('wb_pm_autobackup', '0'); }
    }).catch(() => { localStorage.setItem('wb_pm_autobackup', '0'); });
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
